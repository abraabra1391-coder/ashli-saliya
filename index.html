<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F2">
  <meta name="color-scheme" content="light">
  <title>Wedding Invitation</title>
  <meta name="description" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <audio id="bgMusic" loop preload="auto"></audio>

  <header class="nav" id="nav">
    <a class="nav__mark" href="#home" data-bind="monogram"></a>
    <nav class="nav__links" aria-label="Main"></nav>
    <button class="nav__toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
      <span></span><span></span>
    </button>
  </header>

  <div class="mobile-menu" id="mobileMenu" hidden>
    <p class="mobile-menu__mark" data-bind="monogram"></p>
    <nav class="mobile-menu__links" aria-label="Mobile"></nav>
  </div>

  <main>
    <section class="hero" id="home"></section>
    <section class="section welcome" id="invitation"></section>
    <section class="section couple" id="couple"></section>
    <section class="section countdown" id="countdown"></section>
    <section class="section story" id="story"></section>
    <section class="section venue" id="venue"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <button class="music-btn" id="musicBtn" aria-label="Play music" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
